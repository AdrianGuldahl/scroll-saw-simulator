<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll Saw Simulator — The Lightscroller</title>
<style>
  :root{
    --danger-red:#ff3d1a;
    --paper:#F3EBDC;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#0a0a0b;
    font-family:'Segoe UI', system-ui, sans-serif;
    color:var(--paper);
    overflow-x:hidden;
  }
  #stage{
    position:relative;
    width:100%; min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:36px 20px 60px;
    background:
      radial-gradient(ellipse at 50% -10%, #3a1410 0%, transparent 55%),
      linear-gradient(180deg, #17100e 0%, #0a0808 100%);
  }
  .eyebrow{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:12px;
    color:var(--danger-red);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }
  h1{
    font-family:'Courier New', monospace;
    font-size:clamp(32px, 6.5vw, 52px);
    font-weight:900;
    letter-spacing:4px;
    margin:8px 0 4px 0;
    color:#fff4e2;
    text-align:center;
    text-shadow:0 0 10px rgba(255,200,120,.8), 0 0 30px rgba(255,140,40,.5), 0 0 60px rgba(255,90,20,.3);
    opacity:0;
    animation: fadeUp .6s ease .15s forwards;
  }
  .warncry{
    font-family:'Courier New', monospace;
    font-weight:800;
    font-size:clamp(18px, 3.6vw, 26px);
    letter-spacing:1.5px;
    color:var(--danger-red);
    text-shadow:0 0 10px rgba(255,61,26,.9), 0 0 26px rgba(255,61,26,.5);
    margin:0 0 30px 0;
    text-align:center;
    opacity:0;
    animation: fadeUp .6s ease .3s forwards, flicker 1.8s ease-in-out 1.1s infinite;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes flicker{
    0%,100%{ opacity:1; }
    50%{ opacity:.75; }
  }

  #canvasWrap{
    position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.75), 0 0 60px rgba(255,140,40,.25);
    border-radius:4px;
    padding:24px;
    background:linear-gradient(155deg, #201415 0%, #0f0a0a 55%, #1c1112 100%);
    border:1px solid #4a2016;
    overflow:hidden;
    opacity:0;
    animation: fadeUp .7s ease .45s forwards, shake .5s ease 1.1s, pulseGlow 2.6s ease-in-out 1.6s infinite;
  }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-4px,2px); }
    40%{ transform:translate(4px,-2px); }
    60%{ transform:translate(-3px,1px); }
    80%{ transform:translate(3px,-1px); }
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 24px 70px rgba(0,0,0,.75), 0 0 60px rgba(255,140,40,.25); }
    50%{ box-shadow:0 24px 70px rgba(0,0,0,.75), 0 0 100px rgba(255,150,50,.5); }
  }
  #flash{
    position:fixed; inset:0; z-index:60;
    background:radial-gradient(circle at 50% 45%, rgba(255,235,190,0.9), rgba(255,235,190,0) 60%);
    pointer-events:none;
    opacity:0;
    animation: flashPop 0.7s ease 1.05s forwards;
  }
  @keyframes flashPop{
    0%{ opacity:0; }
    12%{ opacity:1; }
    100%{ opacity:0; }
  }
  #canvasWrap::before{
    content:'';
    position:absolute; inset:14px;
    border:1px solid rgba(255,80,40,0.08);
    pointer-events:none;
  }
  canvas{ display:block; background:#4c5257; box-shadow: inset 0 0 40px rgba(0,0,0,.4); }

  #embers{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    pointer-events:none;
    z-index:50;
    background:transparent !important;
    box-shadow:none !important;
  }

  .stagelist{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:22px 28px;
    max-width:520px;
    margin-top:26px;
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:#a08070;
    opacity:0;
    animation: fadeUp .6s ease 1.4s forwards;
  }
  .stagelist b{ color:var(--paper); display:block; font-size:13px; margin-bottom:2px; }
  .stagelist .stagebox{ text-align:center; }

  .btnrow{
    margin-top:34px;
    display:flex; gap:14px;
    opacity:0;
    animation: fadeUp .6s ease 1.6s forwards;
  }
  button{
    font-family:'Courier New', monospace;
    font-weight:700; letter-spacing:1px;
    padding:12px 22px; border-radius:6px; border:none;
    cursor:pointer; font-size:12px;
  }
  .btn-primary{ background:var(--danger-red); color:#1a0503; }
  .btn-ghost{ background:transparent; color:#a08070; border:1px solid #3a1a16; }
</style>
</head>
<body>
<canvas id="embers"></canvas>
<div id="flash"></div>
<div id="stage">
  <div class="eyebrow">Scroll Saw Simulator</div>
  <h1>THE LIGHTSCROLLER</h1>
  <p class="warncry">"You shouldn't have done that!"</p>

  <div id="canvasWrap">
    <canvas id="art" width="320" height="680"></canvas>
  </div>

  <div class="stagelist">
    <div class="stagebox"><b>Cut 1</b>Handle</div>
    <div class="stagebox"><b>Cut 2</b>Crossguard</div>
    <div class="stagebox"><b>Cut 3</b>Blade</div>
  </div>

  <div class="btnrow">
    <button class="btn-primary" id="nextPicBtn">FACE THE DOOMSCROLLER</button>
    <button class="btn-ghost" id="galleryBtn">SAVE TO GALLERY</button>
  </div>
</div>

const ctx = canvas.getContext('2d');

// them reassemble into the correct sword instead of just decoratively stacking.
const pieceOrder = ['blade','guard','handle']; // draw order: blade first, handle on top
const allPts = pieceOrder.flatMap(k => swordData[k]);
const xs = allPts.map(p=>p[0]), ys = allPts.map(p=>p[1]);
const minx=Math.min(...xs), maxx=Math.max(...xs);
const miny=Math.min(...ys), maxy=Math.max(...ys);
const ocx=(minx+maxx)/2, ocy=(miny+maxy)/2;
const ownSize = Math.max(maxx-minx, maxy-miny);
const DISPLAY_SIZE = 600; // final on-canvas size, in px, for the whole sword — bigger, more dominant
</script>
<script>

function drawMetalPanel(){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, '#889095');
  g.addColorStop(0.45, '#5c6469');
  g.addColorStop(0.55, '#454b4f');
  g.addColorStop(1, '#2a2e31');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // fine cast-metal grain — dark specks only, no light/white dots
  ctx.save();
  let seed = 5;
  const rand = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  for(let i=0;i<500;i++){
    const x = rand()*W, y = rand()*H;
    ctx.fillStyle = `rgba(0,0,0,${0.04+rand()*0.07})`;
    ctx.beginPath();
    ctx.arc(x, y, 0.5+rand()*1.3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // soft golden spotlight behind the sword — this is a special item, not a dark warning
  const glow = ctx.createRadialGradient(W/2,H*0.42,H*0.06, W/2,H*0.42,H*0.6);
  glow.addColorStop(0,'rgba(255,224,160,0.42)');
  glow.addColorStop(0.5,'rgba(255,160,70,0.14)');
  glow.addColorStop(1,'rgba(255,160,70,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  // sunburst rays radiating from behind the sword — the "legendary item" treatment
  ctx.save();
  const cx0 = W/2, cy0 = H*0.42;
  const rayLen = H*0.85;
  const rayCount = 16;
  for(let i=0;i<rayCount;i++){
    const a0 = (i/rayCount)*Math.PI*2;
    const width = 0.10 + (i%2===0 ? 0.05 : 0);
    ctx.save();
    ctx.translate(cx0, cy0);
    ctx.rotate(a0);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-rayLen*Math.sin(width), rayLen*Math.cos(width));
    ctx.lineTo(rayLen*Math.sin(width), rayLen*Math.cos(width));
    ctx.closePath();
    const rg = ctx.createLinearGradient(0,0,0,rayLen);
    rg.addColorStop(0, i%2===0 ? 'rgba(255,210,140,0.16)' : 'rgba(255,210,140,0.07)');
    rg.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // light vignette at the very edges only — keeps focus without going murky
  const vg = ctx.createRadialGradient(W/2,H*0.4,H*0.45, W/2,H*0.4,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(20,5,0,0.28)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // brighter, wider sheen — the polished-chrome look
  ctx.save();
  const sheen = ctx.createLinearGradient(-W*0.2, 0, W*1.1, H*0.6);
  sheen.addColorStop(0.00, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.32, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.44, 'rgba(255,255,255,0.28)');
  sheen.addColorStop(0.52, 'rgba(255,255,255,0.08)');
  sheen.addColorStop(0.62, 'rgba(255,255,255,0)');
  sheen.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawPiece(pts, dx, dy, scale){
  ctx.save();
  const path = new Path2D();
  pts.forEach((p,i)=> {
    const x=(p[0]-ocx)*scale + dx, y=(p[1]-ocy)*scale + dy;
    i===0 ? path.moveTo(x,y) : path.lineTo(x,y);
  });
  path.closePath();

  // brighter gunmetal fill instead of near-black, so it reads as polished steel
  const base = ctx.createLinearGradient(dx-scale*ownSize*0.3, dy-scale*ownSize*0.5, dx+scale*ownSize*0.2, dy+scale*ownSize*0.5);
  base.addColorStop(0, '#3a3f43');
  base.addColorStop(0.5, '#26292c');
  base.addColorStop(1, '#1a1c1e');
  ctx.fillStyle = base;
  ctx.fill(path);

  ctx.save();
  ctx.clip(path);

  // broad soft highlight
  const hl = ctx.createLinearGradient(dx-scale*ownSize*0.3, dy-scale*ownSize*0.3, dx+scale*ownSize*0.2, dy+scale*ownSize*0.2);
  hl.addColorStop(0, 'rgba(255,255,255,0.55)');
  hl.addColorStop(0.32, 'rgba(255,255,255,0.14)');
  hl.addColorStop(0.6, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(dx-scale*ownSize, dy-scale*ownSize, scale*ownSize*2, scale*ownSize*2);

  // tight bright chrome streak for real shine, not just a glow
  const streak = ctx.createLinearGradient(dx-scale*ownSize*0.15, dy-scale*ownSize*0.45, dx+scale*ownSize*0.05, dy+scale*ownSize*0.45);
  streak.addColorStop(0.42, 'rgba(255,255,255,0)');
  streak.addColorStop(0.5, 'rgba(255,255,255,0.85)');
  streak.addColorStop(0.58, 'rgba(255,255,255,0)');
  ctx.fillStyle = streak;
  ctx.fillRect(dx-scale*ownSize, dy-scale*ownSize, scale*ownSize*2, scale*ownSize*2);

  ctx.restore();

  ctx.restore();
}

const drawScale = DISPLAY_SIZE / ownSize;
const drawDx = W/2, drawDy = H/2;

ctx.clearRect(0,0,W,H);
drawMetalPanel();
pieceOrder.forEach(key=>{
  drawPiece(swordData[key], drawDx, drawDy, drawScale);
});

setTimeout(()=>{ if(!embersFired){ embersFired = true; startEmbers(); } }, 900);

// ---------- Ember shower — sparks falling, not party confetti ----------
let embersFired = false;
const emberCanvas = document.getElementById('embers');
const ectx = emberCanvas.getContext('2d');

function startEmbers(){
  emberCanvas.width = window.innerWidth;
  emberCanvas.height = window.innerHeight;

  const pieces = [];
  for(let i=0;i<170;i++){
    pieces.push({
      x: Math.random()*emberCanvas.width,
      y: -20 - Math.random()*emberCanvas.height*0.4,
      r: 1.8+Math.random()*3.4,
      vx: (Math.random()-0.5)*1.6,
      vy: 1.8+Math.random()*2.8,
      drift: Math.random()*Math.PI*2,
      life: 1
    });
  }

  const emberStart = performance.now();
  function emberFrame(t){
    const elapsed = (t-emberStart)/1000;
    ectx.clearRect(0,0,emberCanvas.width,emberCanvas.height);
    let anyAlive = false;
    pieces.forEach(p=>{
      p.drift += 0.05;
      p.x += p.vx + Math.sin(p.drift)*0.5;
      p.y += p.vy;
      p.life -= 0.0035;
      if(p.life > 0 && p.y < emberCanvas.height+20) anyAlive = true;
      if(p.life <= 0) return;
      ectx.save();
      ectx.globalAlpha = p.life;
      const g = ectx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
      g.addColorStop(0, 'rgba(255,240,210,1)');
      g.addColorStop(0.4, 'rgba(255,150,50,0.9)');
      g.addColorStop(1, 'rgba(255,60,20,0)');
      ectx.fillStyle = g;
      ectx.beginPath();
      ectx.arc(p.x, p.y, p.r*2.5, 0, Math.PI*2);
      ectx.fill();
      ectx.restore();
    });
    if(anyAlive && elapsed < 6){
      requestAnimationFrame(emberFrame);
    } else {
      ectx.clearRect(0,0,emberCanvas.width,emberCanvas.height);
    }
  }
  requestAnimationFrame(emberFrame);
}

document.getElementById('nextPicBtn').addEventListener('click', ()=>{
  alert('He is coming. 🔥');
});
document.getElementById('galleryBtn').addEventListener('click', ()=>{
  alert('Gallery saving is a nice future feature — for now, screenshot away! 📸');
});
</script>
</body>
