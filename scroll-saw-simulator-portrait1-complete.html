<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll Saw Simulator — Portrait 1: Complete</title>
<style>
  :root{
    --wood-dark:#3E2723;
    --safety-orange:#FF6B1A;
    --paper:#F3EBDC;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--wood-dark);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:var(--paper);
    overflow-x:hidden;
  }
  #stage{
    position:relative;
    width:100%; min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:36px 20px 60px;
    background:
      radial-gradient(ellipse at 50% -10%, #5a3a24 0%, transparent 60%),
      linear-gradient(180deg, #2b1f18 0%, #1b1410 100%);
  }
  .eyebrow{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:12px;
    color:var(--safety-orange);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }
  h1{
    font-family:'Courier New', monospace;
    font-size:clamp(26px, 5vw, 40px);
    letter-spacing:2px;
    margin:8px 0 4px 0;
    color:var(--paper);
    text-align:center;
    opacity:0;
    animation: fadeUp .6s ease .15s forwards;
  }
  .sub{
    font-size:13px;
    color:#c9b8a2;
    letter-spacing:.5px;
    margin:0 0 30px 0;
    text-align:center;
    opacity:0;
    animation: fadeUp .6s ease .3s forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #canvasWrap{
    position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    border-radius:4px;
    padding:26px;
    background:linear-gradient(155deg, #2c2c2e 0%, #131314 55%, #232325 100%);
    border:1px solid #000;
    overflow:hidden;
    opacity:0;
    animation: fadeUp .7s ease .45s forwards;
  }
  #canvasWrap::before{
    content:'';
    position:absolute; inset:14px;
    border:1px solid rgba(255,255,255,0.06);
    pointer-events:none;
  }
  canvas{ display:block; background:#d9b98a; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }

  #confetti{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    pointer-events:none;
    z-index:50;
    background:transparent !important;
    box-shadow:none !important;
  }

  .stagelist{
    display:flex; gap:28px;
    margin-top:26px;
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:#a08a6f;
    opacity:0;
    animation: fadeUp .6s ease 1.1s forwards;
  }
  .stagelist b{ color:var(--paper); display:block; font-size:13px; margin-bottom:2px; }
  .stagelist .stagebox{ text-align:center; }

  .btnrow{
    margin-top:34px;
    display:flex; gap:14px;
    opacity:0;
    animation: fadeUp .6s ease 1.3s forwards;
  }
  button{
    font-family:'Courier New', monospace;
    font-weight:700; letter-spacing:1px;
    padding:12px 22px; border-radius:6px; border:none;
    cursor:pointer; font-size:12px;
  }
  .btn-primary{ background:var(--safety-orange); color:#241300; }
  .btn-ghost{ background:transparent; color:#c9b8a2; border:1px solid #4a3527; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="stage">
  <div class="eyebrow">Scroll Saw Simulator</div>
  <h1>LEARNING TO FLY!</h1>
  <p class="sub">Three cuts, one finished piece.</p>

  <div id="canvasWrap">
    <canvas id="art" width="420" height="594"></canvas>
  </div>

  <div class="stagelist">
    <div class="stagebox"><b>Level 1</b>The Outline Race</div>
    <div class="stagebox"><b>Level 2</b>The Detail Run</div>
    <div class="stagebox"><b>Level 3</b>The Final Cut</div>
  </div>

  <div class="btnrow">
    <button class="btn-primary" id="nextPicBtn">START PORTRAIT 2</button>
    <button class="btn-ghost" id="galleryBtn">SAVE TO GALLERY</button>
  </div>
</div>

<script>
const ptdata = JSON.parse(document.getElementById('ptdata').textContent);
const P2 = ptdata.p2;
const P3 = ptdata.p3;

function normalizeToLocal(pts){
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs);
  const miny=Math.min(...ys), maxy=Math.max(...ys);
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const size = Math.max(maxx-minx, maxy-miny);
  return pts.map(p => [ (p[0]-cx)/size, (p[1]-cy)/size ]); // -0.5..0.5 range
}

const shapes = [normalizeToLocal(P1), normalizeToLocal(P2), normalizeToLocal(P3)];

function drawWoodPanel(){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, '#e0bd8c');
  g.addColorStop(0.5, '#d3aa78');
  g.addColorStop(1, '#c39c6a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // fibrous MDF-style texture: lots of tiny short flecks in random directions
  ctx.save();
  for(let i=0;i<900;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const len = 2+Math.random()*5;
    const ang = Math.random()*Math.PI;
    ctx.strokeStyle = Math.random()>0.5 ? 'rgba(120,85,45,0.18)' : 'rgba(255,235,200,0.18)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len);
    ctx.stroke();
  }
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H/2,H*0.2, W/2,H/2,H*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.16)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // glossy varnish sheen — a soft diagonal streak of light across the panel
  ctx.save();
  const sheen = ctx.createLinearGradient(-W*0.2, 0, W*1.1, H*0.7);
  sheen.addColorStop(0.00, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.32, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.42, 'rgba(255,255,255,0.16)');
  sheen.addColorStop(0.50, 'rgba(255,255,255,0.05)');
  sheen.addColorStop(0.58, 'rgba(255,255,255,0.12)');
  sheen.addColorStop(0.68, 'rgba(255,255,255,0)');
  sheen.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawButterfly(shape, cx, cy, scale, rot){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);

  const path = new Path2D();
  shape.forEach((p,i)=> {
    const x=p[0]*scale, y=p[1]*scale;
    i===0 ? path.moveTo(x,y) : path.lineTo(x,y);
  });
  path.closePath();

  ctx.fillStyle = '#0c0c0d';
  ctx.fill(path);

  // glossy varnish highlight, clipped to the shape
  ctx.save();
  ctx.clip(path);
  const hl = ctx.createLinearGradient(-scale*0.5,-scale*0.5, scale*0.35, scale*0.35);
  hl.addColorStop(0, 'rgba(255,255,255,0.30)');
  hl.addColorStop(0.35, 'rgba(255,255,255,0.05)');
  hl.addColorStop(0.6, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(-scale, -scale, scale*2, scale*2);
  ctx.restore();

  ctx.restore();
}

// Scales chosen, then stacked with a fixed gap between each shape's
// bounding box so they never touch, however wide any individual butterfly is.
const scales = [130, 150, 122];
const gap = 26;
let cursorY = 46;
const slots = scales.map((scale, i) => {
  cursorY += scale/2;
  const slot = { cy: cursorY, scale, rot: [-0.05, 0.04, -0.03][i] };
  cursorY += scale/2 + gap;
  return slot;
});

ctx.clearRect(0,0,W,H);
drawWoodPanel();
shapes.forEach((shape, i)=>{
  const s = slots[i];
  drawButterfly(shape, W/2, s.cy, s.scale, s.rot);
});

setTimeout(()=>{ if(!confettiFired){ confettiFired = true; startConfetti(); } }, 500);

// ---------- Confetti celebration ----------
let confettiFired = false;
const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
const CONFETTI_COLORS = ['#FF6B1A', '#f0d29a', '#c39c6a', '#F3EBDC', '#9AA0A6', '#e0bd8c'];

function startConfetti(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;

  const pieces = [];
  for(let i=0;i<140;i++){
    pieces.push({
      x: Math.random()*confettiCanvas.width,
      y: -20 - Math.random()*confettiCanvas.height*0.5,
      w: 6+Math.random()*6,
      h: 4+Math.random()*8,
      vx: (Math.random()-0.5)*1.6,
      vy: 2+Math.random()*2.5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.2,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      drift: Math.random()*Math.PI*2
    });
  }

  const confettiStart = performance.now();
  function confettiFrame(t){
    const elapsed = (t-confettiStart)/1000;
    cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    let anyOnScreen = false;
    pieces.forEach(p=>{
      p.drift += 0.06;
      p.x += p.vx + Math.sin(p.drift)*0.6;
      p.y += p.vy;
      p.rot += p.vr;
      if(p.y < confettiCanvas.height+20) anyOnScreen = true;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    });
    if(anyOnScreen && elapsed < 5){
      requestAnimationFrame(confettiFrame);
    } else {
      cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    }
  }
  requestAnimationFrame(confettiFrame);
}

document.getElementById('nextPicBtn').addEventListener('click', ()=>{
  window.location.href = 'the-owl-of-mystery-1.html';
});
document.getElementById('galleryBtn').addEventListener('click', ()=>{
  alert('Gallery saving is a nice future feature — for now, screenshot away! 📸');
});
