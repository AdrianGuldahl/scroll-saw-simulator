<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll Saw Simulator — The Owl of Mystery</title>
<style>
  :root{
    --wood-dark:#3E2723;
    --safety-orange:#FF6B1A;
    --paper:#F3EBDC;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--wood-dark);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:var(--paper);
    overflow-x:hidden;
  }
  #stage{
    position:relative;
    width:100%; min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center;
    padding:36px 20px 60px;
    background:
      radial-gradient(ellipse at 50% -10%, #5a3a24 0%, transparent 60%),
      linear-gradient(180deg, #2b1f18 0%, #1b1410 100%);
  }
  .eyebrow{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:12px;
    color:var(--safety-orange);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }
  h1{
    font-family:'Courier New', monospace;
    font-size:clamp(26px, 5vw, 40px);
    letter-spacing:2px;
    margin:8px 0 4px 0;
    color:var(--paper);
    text-align:center;
    opacity:0;
    animation: fadeUp .6s ease .15s forwards;
  }
  .sub{
    font-size:13px;
    color:#c9b8a2;
    letter-spacing:.5px;
    margin:0 0 30px 0;
    text-align:center;
    opacity:0;
    animation: fadeUp .6s ease .3s forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #canvasWrap{
    position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    border-radius:4px;
    padding:26px;
    background:linear-gradient(155deg, #2c2c2e 0%, #131314 55%, #232325 100%);
    border:1px solid #000;
    overflow:hidden;
    opacity:0;
    animation: fadeUp .7s ease .45s forwards;
  }
  #canvasWrap::before{
    content:'';
    position:absolute; inset:14px;
    border:1px solid rgba(255,255,255,0.06);
    pointer-events:none;
  }
  canvas{ display:block; background:#d9b98a; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }

  #confetti{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    pointer-events:none;
    z-index:50;
    background:transparent !important;
    box-shadow:none !important;
  }

  .stagelist{
    display:flex; gap:28px;
    margin-top:26px;
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:#a08a6f;
    opacity:0;
    animation: fadeUp .6s ease 1.1s forwards;
  }
  .stagelist b{ color:var(--paper); display:block; font-size:13px; margin-bottom:2px; }
  .stagelist .stagebox{ text-align:center; }

  .btnrow{
    margin-top:34px;
    display:flex; gap:14px;
    opacity:0;
    animation: fadeUp .6s ease 1.3s forwards;
  }
  button{
    font-family:'Courier New', monospace;
    font-weight:700; letter-spacing:1px;
    padding:12px 22px; border-radius:6px; border:none;
    cursor:pointer; font-size:12px;
  }
  .btn-primary{ background:var(--safety-orange); color:#241300; }
  .btn-ghost{ background:transparent; color:#c9b8a2; border:1px solid #4a3527; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="stage">
  <div class="eyebrow">Scroll Saw Simulator</div>
  <h1>THE OWL OF MYSTERY</h1>
  <p class="sub">Four cuts, one finished piece.</p>

  <div id="canvasWrap">
    <canvas id="art" width="420" height="594"></canvas>
  </div>

  <div class="stagelist">
    <div class="stagebox"><b>Level 1</b>Left Eye</div>
    <div class="stagebox"><b>Level 2</b>Right Eye</div>
    <div class="stagebox"><b>Level 3</b>Right Wing</div>
    <div class="stagebox"><b>Level 4</b>Body</div>
  </div>

  <div class="btnrow">
    <button class="btn-primary" id="nextPicBtn">START THE NEXT PIECE</button>
    <button class="btn-ghost" id="galleryBtn">SAVE TO GALLERY</button>
  </div>
</div>

const ctx = canvas.getContext('2d');

  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H/2,H*0.2, W/2,H/2,H*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.16)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // glossy varnish sheen — a soft diagonal streak of light across the panel
  ctx.save();
  const sheen = ctx.createLinearGradient(-W*0.2, 0, W*1.1, H*0.7);
  sheen.addColorStop(0.00, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.32, 'rgba(255,255,255,0)');
  sheen.addColorStop(0.42, 'rgba(255,255,255,0.16)');
  sheen.addColorStop(0.50, 'rgba(255,255,255,0.05)');
  sheen.addColorStop(0.58, 'rgba(255,255,255,0.12)');
  sheen.addColorStop(0.68, 'rgba(255,255,255,0)');
  sheen.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawPiece(pts, dx, dy, scale){
  ctx.save();
  const path = new Path2D();
  pts.forEach((p,i)=> {
    const x=(p[0]-ocx)*scale + dx, y=(p[1]-ocy)*scale + dy;
    i===0 ? path.moveTo(x,y) : path.lineTo(x,y);
  });
  path.closePath();

  ctx.fillStyle = '#0c0c0d';
  ctx.fill(path);

  // glossy varnish highlight, clipped to the shape
  ctx.save();
  ctx.clip(path);
  const hl = ctx.createLinearGradient(dx-scale*ownSize*0.3, dy-scale*ownSize*0.3, dx+scale*ownSize*0.2, dy+scale*ownSize*0.2);
  hl.addColorStop(0, 'rgba(255,255,255,0.30)');
  hl.addColorStop(0.35, 'rgba(255,255,255,0.05)');
  hl.addColorStop(0.6, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(dx-scale*ownSize, dy-scale*ownSize, scale*ownSize*2, scale*ownSize*2);
  ctx.restore();

  ctx.restore();
}

const drawScale = DISPLAY_SIZE / ownSize;
const drawDx = W/2, drawDy = H/2;

ctx.clearRect(0,0,W,H);
drawWoodPanel();
pieceOrder.forEach(key=>{
  drawPiece(owlData[key], drawDx, drawDy, drawScale);
});

setTimeout(()=>{ if(!confettiFired){ confettiFired = true; startConfetti(); } }, 500);

// ---------- Confetti celebration ----------
let confettiFired = false;
const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
const CONFETTI_COLORS = ['#FF6B1A', '#f0d29a', '#c39c6a', '#F3EBDC', '#9AA0A6', '#e0bd8c'];

function startConfetti(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;

  const pieces = [];
  for(let i=0;i<140;i++){
    pieces.push({
      x: Math.random()*confettiCanvas.width,
      y: -20 - Math.random()*confettiCanvas.height*0.5,
      w: 6+Math.random()*6,
      h: 4+Math.random()*8,
      vx: (Math.random()-0.5)*1.6,
      vy: 2+Math.random()*2.5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.2,
      color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      drift: Math.random()*Math.PI*2
    });
  }

  const confettiStart = performance.now();
  function confettiFrame(t){
    const elapsed = (t-confettiStart)/1000;
    cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    let anyOnScreen = false;
    pieces.forEach(p=>{
      p.drift += 0.06;
      p.x += p.vx + Math.sin(p.drift)*0.6;
      p.y += p.vy;
      p.rot += p.vr;
      if(p.y < confettiCanvas.height+20) anyOnScreen = true;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    });
    if(anyOnScreen && elapsed < 5){
      requestAnimationFrame(confettiFrame);
    } else {
      cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    }
  }
  requestAnimationFrame(confettiFrame);
}
